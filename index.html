<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Unity LLM Chatbot</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        /* 加上了 display: flex，这样气泡才能实现一左一右对齐 */
        #messages { flex: 1; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 8px; display: flex; flex-direction: column; }
        .message { margin: 10px 0; padding: 10px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #e3f2fd; align-self: flex-end; }
        .ai-message { background: #f5f5f5; align-self: flex-start; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="messages"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Message..." onkeypress="if(event.keyCode==13) sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

<script>
    let socket;
    let chatContainer; 
    let currentAiBubble = null; 

    // 【终极本地测试版】直接指向你本机的 Unity 9000 端口！注意是 ws://，没有 s！
    const socketUrl = "ws://localhost:9000"; 

    window.onload = function() {
        chatContainer = document.getElementById('messages'); 
        connectToServer();
    };

    function connectToServer() {
        console.log("🚀 正在尝试纯本地直连 WebSocket:", socketUrl);
        socket = new WebSocket(socketUrl);
        
        socket.onopen = function() {
            console.log("✅ WebSocket 连接成功！Unity 本地端口是通的！");
        };

        socket.onerror = function(error) {
            console.error("❌ WebSocket 报错了:", error);
        };

        socket.onmessage = function(event) {
            if (currentAiBubble) {
                currentAiBubble.innerText = event.data;
                if(chatContainer) {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }
        };

        socket.onclose = function() {
            console.log("⚠️ 连接断开了，3秒后正在尝试重连...");
            setTimeout(connectToServer, 3000); 
        };
    }

    function sendMessage() {
        const inputField = document.getElementById('user-input'); 
        const text = inputField.value;
        
        if (!text) return;

        if (!socket || socket.readyState !== WebSocket.OPEN) {
            alert("连接还没准备好或者 Unity 没运行，请稍等...");
            return;
        }

        const userBubble = document.createElement('div');
        userBubble.className = 'message user-message'; 
        userBubble.innerText = text;
        chatContainer.appendChild(userBubble);

        const newAiBubble = document.createElement('div');
        newAiBubble.className = 'message ai-message'; 
        newAiBubble.innerText = '...Thinking...'; 
        chatContainer.appendChild(newAiBubble);
        
        currentAiBubble = newAiBubble;

        socket.send(text);

        inputField.value = '';
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
</script>
</body>

</html>
