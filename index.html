<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Unity LLM Chatbot</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        /* 加上了 display: flex，这样气泡才能实现一左一右对齐 */
        #messages { flex: 1; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 8px; display: flex; flex-direction: column; }
        .message { margin: 10px 0; padding: 10px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #e3f2fd; align-self: flex-end; }
        .ai-message { background: #f5f5f5; align-self: flex-start; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="messages"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Message..." onkeypress="if(event.keyCode==13) sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

<script>
    let socket;
    let chatContainer; 
    let currentAiBubble = null; 

    // ⚠️ 【全场唯一需要你修改的地方】 ⚠️
    // 把下面引号里的内容，换成你刚刚开启隧道生成的 https:// 网址！
    // 注意：每次你关闭并重新打开 Ngrok/Pinggy，这个网址都会变，记得每次都要来这里改一下！
    const tunnelUrl = "https://nontranscribing-nonrelativistic-siobhan.ngrok-free.dev"; 

    window.onload = function() {
        chatContainer = document.getElementById('messages'); 
        connectToServer();
    };

    function connectToServer() {
        // 自动把 https:// 替换成 WebSocket 专属的 wss:// 协议（这步千万别删！）
        const socketUrl = tunnelUrl.replace("https://", "wss://").replace("http://", "ws://");
        
        console.log("🚀 正在尝试连接外网 WebSocket:", socketUrl);
        socket = new WebSocket(socketUrl);
        
        socket.onopen = function() {
            console.log("✅ WebSocket 连接成功！墙已被彻底打穿！");
            
            // 连上之后在界面上给个绿色的成功提示
            const sysBubble = document.createElement('div');
            sysBubble.className = 'message ai-message'; 
            sysBubble.style.background = '#e8f5e9'; 
            sysBubble.innerText = '✅ 系统提示：已成功连接到主机的 Unity 服务器！可以开始聊天了。';
            chatContainer.appendChild(sysBubble);
        };

        socket.onerror = function(error) {
            console.error("❌ WebSocket 报错了:", error);
        };

        socket.onmessage = function(event) {
            // 把 Unity 传过来的完整句子直接塞进 AI 气泡
            if (currentAiBubble) {
                currentAiBubble.innerText = event.data;
                if(chatContainer) {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }
        };

        // 如果断开了，3秒后自动重连
        socket.onclose = function() {
            console.log("⚠️ 连接断开了，3秒后正在尝试重连...");
            setTimeout(connectToServer, 3000); 
        };
    }

    function sendMessage() {
        const inputField = document.getElementById('user-input'); 
        const text = inputField.value;
        
        if (!text) return;

        // 如果没连上，拦住用户不让发，并弹出警告
        if (!socket || socket.readyState !== WebSocket.OPEN) {
            alert("❌ 连接还没准备好，或者 Unity 没运行！请等待连接成功。");
            return;
        }

        // 画用户的气泡
        const userBubble = document.createElement('div');
        userBubble.className = 'message user-message'; 
        userBubble.innerText = text;
        chatContainer.appendChild(userBubble);

        // 预创建 AI 的空气泡
        const newAiBubble = document.createElement('div');
        newAiBubble.className = 'message ai-message'; 
        newAiBubble.innerText = '...Thinking...'; 
        chatContainer.appendChild(newAiBubble);
        
        // 更新全局变量，把目标锁定到这个新的 AI 气泡上
        currentAiBubble = newAiBubble;

        // 发给后端的 Unity
        socket.send(text);

        // 清空输入框并滚动到底部
        inputField.value = '';
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
</script>
</body>

</html>
